# Exact versions this benchmark's published results were produced with.
#
# WHY THIS FILE EXISTS
# --------------------
# pyproject declares floors, which is right for installing but wrong for
# reproducing: `anthropic>=0.87.0` resolves differently in six months. Two things
# here depend on the SDK's exact shape rather than just its API. TOOLS is hashed
# into the rollout fingerprint, and blocks.py normalises provider responses into the
# Anthropic block shapes - so an SDK change can move a fingerprint or alter what a
# transcript records, and either makes a batch incomparable with the ones before it.
#
# Verified against OSV.dev with no advisory outstanding for any version pinned here.
#
#     pip install -r requirements.lock     # reproduce this stack exactly
#     pip install -e '.[openrouter,openai,test]'   # ordinary install, floors only
#
# Regenerate when the stack is deliberately moved, and note it in the CHANGELOG so a
# results directory can be tied back to the stack that produced it:
#
#     python -m pip list --format=freeze | grep -v '^subversionbench==\|^pip=='
#
# Captured on Python 3.12.13, 2026-08-12.
