[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subversionbench"
version = "107.0.0"
description = "Agentic misalignment, scheming and evaluation awareness eval with eval awareness detection, sandbox isolation, rubric-based grading, and timing instrumentation."
requires-python = ">=3.10"
license = "LicenseRef-MIT-with-Attribution"
license-files = ["LICENSE"]
authors = [{ name = "Kevin O'Shaughnessy" }]
# Floors are set by advisories, not by the oldest version that happens to work.
# anthropic < 0.87.0 carries GHSA-q5f5-3gjm-7mfm (memory-tool files created 0o666)
# and GHSA-w828-4qhx-vxx3 (memory-tool path validation TOCTOU, sandbox escape).
# Neither is reachable from this codebase - nothing here touches the SDK memory tool
# - but a floor that admits a vulnerable version is a floor that will one day be
# resolved to one. See test_dependencies.py, which pins these minimums.
dependencies = [
    "anthropic>=0.87.0",
]

[project.optional-dependencies]
# pytest < 9.0.3 carries GHSA-6w46-j5rx-g56g (predictable /tmp/pytest-of-{user},
# local DoS or privilege gain). This suite uses tempfile.mkdtemp rather than the
# tmp_path fixture, so it is not exposed, but the same reasoning applies.
#
# pyflakes was used and not declared: test_config.py runs it for the undefined-name
# guard and skips when it is absent, so on a clean install that guard silently
# disappeared - and it is the guard that caught three bad import prunings during the
# refactor.
#
# httpx is anthropic's own transport dependency, already present on any install -
# declared here because the interrogation-classifier retry tests construct real
# anthropic.APIStatusError/APIConnectionError instances, which need a real
# httpx.Request/Response rather than a stand-in that would not exercise the
# actual exception attributes (status_code) the retry logic reads.
#
# matplotlib draws the trends/ charts and nothing else. It is an EXTRA rather
# than a dependency because every number it plots is already printed as a table
# and written to JSON: a chart is a second reading of the same figures, so an
# install that skips it loses presentation and no analysis. The trends CLI
# degrades to tables with an install hint rather than failing.
#
# PyYAML parses .github/workflows/tests.yml for test_ci_workflow.py, which checks
# that CI still runs the Python floor pyproject promises, that the fully-installed
# job forbids dependency skips, and that no job asks for a credential. Declared
# rather than skipped-when-absent because those checks are worth running: a
# skipped guard is the shape of silent pass this project keeps finding bugs
# behind, and CI's own job treats a dependency skip as a failure.
#
# ruff is the style and bug-pattern gate, run as its own CI job. It does NOT
# replace the pyflakes guards in test_config.py: those take their file list from
# conftest, so a newly added module is checked the moment it exists, and they run
# in the suite where a developer sees them without pushing.
#
# coverage enforces a floor in its own CI job. The floor and the reasoning behind
# its value are in [tool.coverage.report] below.
test = ["pytest>=9.0.3", "pyflakes>=3.0", "httpx", "PyYAML>=6.0", "ruff>=0.16",
        "coverage>=7.0"]
charts = ["matplotlib>=3.8"]
openrouter = ["openai>=1.0.0"]
openai = ["openai>=1.0.0"]

[project.scripts]
subversionbench = "subversionbench.run_eval:main"

[tool.coverage.run]
# Branch coverage, not just statements: a guard whose false arm is never taken
# is exactly the shape of silent pass this project keeps finding bugs behind, and
# statement coverage cannot see it.
branch = true
source = ["."]
omit = [
    # The suite is what exercises the source; measuring it too would report the
    # tests' own coverage of themselves and inflate the total.
    "test_*.py",
    "*/test_*.py",
    "conftest.py",
    # run_tests.py is the pytest-free runner. Running it under the pytest run
    # would measure the wrong thing - see the note in .github/workflows.
    "run_tests.py",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
# THE FLOOR IS MEASURED, NOT ASPIRED TO. Both platforms report 91% at the time
# it was set - macOS 616 statements missed, Linux 618, a two-statement spread -
# so 90 leaves about a point of headroom and cannot flake between the runners.
#
# Set it higher only after measuring, and on both platforms: 24 of the sandbox
# tests are macOS-only and the isolation module's branches divide the other way
# on Linux, so a floor tuned to one platform is a floor that fails on the other.
fail_under = 90
skip_covered = true
show_missing = true
exclude_also = [
    # Not reachable under the test runner by construction.
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
# WHY THE RULE SET IS WRITTEN DOWN
# --------------------------------
# Without this section ruff lints against whatever its installed version happens
# to default to. Measured on one machine: `ruff check .` with no config enabled
# 415 rules and reported 578 findings, while the documented default of
# E4/E7/E9/F reports 103. A gate whose strictness moves when a dependency is
# upgraded is not a gate, so the set is declared rather than inherited.
#
# Line length is not enforced. The codebase already writes to about 85 columns
# on its own - p99.5 is 85 and only 42 lines of 56,427 exceed 90 - so a limit
# here would buy nothing and would force rewrapping of prose comments that are
# doing real explanatory work.
target-version = "py310"

[tool.ruff.lint]
# Chosen so the gate PASSES today. A rule set adopted with hundreds of
# violations left outstanding is one that gets switched off the first time it is
# inconvenient, and then the drift it was meant to stop resumes unobserved.
select = [
    "E4", "E7", "E9",  # pycodestyle errors: imports, statements, syntax
    "F",               # pyflakes: undefined names, unused imports
    "W",               # pycodestyle warnings
    "B",               # bugbear: mutable defaults, `assert False`, loop closures
    "C4",              # comprehension and collection-call simplifications
    "UP",              # constructs superseded by the Python floor
    "PIE",             # small unnecessary-code patterns
    "RSE", "LOG", "G", # raise/logging hygiene - all three are clean, kept clean
    "A",               # shadowing a builtin
    "ISC001", "ISC002",  # a missing comma silently concatenating two strings
]

# B905, zip() without strict=, is deliberately NOT ignored any more. Every one of
# the 33 sites now says which it means:
#
#   strict=True   equal length is the invariant, so a mismatch should raise
#                 rather than silently drop the tail of the longer sequence
#   strict=False  the lengths differ BY DESIGN - four sites pair a sequence with
#                 its own tail, and one pairs two independently truncated lists
#
# Enforced rather than reasoned about, which is the point: the choice is now at
# each call site instead of in someone's head. Verified not to move a single
# figure - see the v103 entry in CHANGELOG.md for how.

[tool.ruff.lint.per-file-ignores]
# Two modules whose stated job is to be one import site for names that live
# elsewhere - both say so in their docstrings, and both already maintain
# __all__. Re-exported private names cannot go in __all__ without declaring
# them public, which they are not.
#
# Scoped to these two files rather than ignored globally, so a genuinely stray
# import anywhere else is still reported.
"subversionbench/llm_client.py" = ["F401"]
"subversionbench/grading/__init__.py" = ["F401"]

# Deliberately NOT selected, with the reason, so the next person does not have
# to rediscover it:
#
#   RUF001, PLE2515  ambiguous and zero-width unicode. This benchmark's SUBJECT
#                    is invisible and confusable characters; the test corpus is
#                    full of them on purpose. 155 findings, all intended.
#   I001             import sorting. Would rewrite the import block of nearly
#                    every file in one unreviewable diff.
#   DTZ              naive datetime.now(). Adding tzinfo changes the timestamps
#                    written into saved run files - a data change, not a lint.
#   SIM115           open() without a context manager. All 39 are in tests, and
#                    CPython closes them on refcount drop.
#   PERF401, PERF203 rewriting loops as comprehensions, and try/except out of
#                    loops. Both cost readability here for no measured gain.
#   RET504           assign-then-return. summary_document builds a 200-line dict
#                    literal; naming it before returning is clearer, not worse.
#   EM, TRY, TID, PT style preferences that would fight the existing code.

[tool.setuptools.packages.find]
# `trends` and `report` are deliberately NOT included, even though both are
# packages rather than root scripts. `report` imports report_charts and `trends`
# imports model_releases, which ARE root scripts and are not installed, so
# shipping either would install something that cannot import. Like the other
# analysis entry points they run from a checkout: `python3 -m report`,
# `python3 -m trends`.
include = ["subversionbench*"]
